protocol_id: C3E6-STAGE2
protocol_version: 0.4.1
status: preflight_only
created_for: C3E multimodal selective-reliability transport study
authorization:
  documentation: true
  configuration_validation: true
  metadata_audit_after_access: true
  medical_image_loading: false
  model_training: false
  target_site_tuning: false
  cross_site_claims_before_results: false
research_question: Does a selective policy calibrated at the source hospital remain
  reliable at an external hospital when pre-diagnostic clinical context changes in
  availability or alignment?
study_identity:
  study_type: retrospective_predeployment_evaluation
  primary_contribution: compound_shift_selective_reliability_protocol
  not_claimed:
  - new_multimodal_architecture
  - new_uncertainty_algorithm
  - prospective_clinical_validation
  - patient_outcome_improvement
  - regulatory_validation
datasets:
  source:
    id: mimic_cxr_jpg
    version: 2.1.0
    role: development_and_internal_evaluation
    official_splits_required: false
    calibration_subset:
      parent_split: train
      unit: patient
      seed: 20260718
      patients: 3000
    # v0.3.0: the official test split yields only 282 patients in the Stage 3C
    # cohort, which Stage 3D showed is materially power-limited for H1. A
    # prespecified patient-disjoint partition is carved from train instead.
    # Assignment uses patient identifiers and the frozen seed only; no label,
    # outcome, image, or model output participates.
    evaluation_partition:
      role: primary_confirmatory_evaluation
      parent_split: train
      unit: patient
      seed: 20260718
      patients: 5000
      disjoint_from:
      - calibration_subset
      - model_train
      - official_validate
      - official_test
    official_splits_retained_as: secondary_confirmation
    official_split_comparability_note: primary confirmatory estimates are not directly
      comparable to published official-split baselines; official validate and test
      results are reported alongside as secondary confirmation
  external:
    id: chexpert_plus
    role: locked_external_evaluation_only
    tuning_allowed: false
analysis_units:
  model_inference_unit: image
  decision_unit: study
  statistical_cluster_unit: patient
  study_weighting: equal
  frontal_image_aggregation: arithmetic_mean_probability
targets:
  pathologies:
  - Cardiomegaly
  - Edema
  - Pleural Effusion
  - Atelectasis
  - Consolidation
  primary_label_source: impression_fixed.json
  sensitivity_label_source: findings_fixed.json
  forbidden_label_source: report_fixed.json
  official_mimic_labels_role: auxiliary_concordance_audit_only
text_policy:
  permitted_sections_external:
  - section_clinical_history
  - section_history
  permitted_sections_source:
  - indication
  - history
  forbidden_sections:
  - findings
  - impression
  - report
  - summary
  prediction_time_requirement: pre_diagnostic_only
  # Resolved 2026-07-28 through MIMIC intake (Stage 3A/3B/3B-2), as required by
  # README.md "Intentionally pending". No external (CheXpert Plus) result was
  # inspected; this mapping is prespecified, not post-hoc exploratory.
  source_section_synonyms:
    indication:
    - INDICATION
    - CLINICAL INDICATION
    - REASON FOR EXAMINATION
    - REASON FOR EXAM
    history:
    - HISTORY
    - CLINICAL HISTORY
    - PATIENT HISTORY
    - CLINICAL INFORMATION
  source_sections_excluded_as_post_diagnostic:
  - WET READ
  - PROVISIONAL FINDINGS IMPRESSION
  - RECOMMENDATION
  - NOTIFICATION
  - ADDENDUM
  - COMMENT
  extraction_rule: header_driven_not_position_driven
cohort_policy:
  # Structural exclusions resolved through MIMIC intake, prespecified before any
  # label generation, model run, or external-result inspection.
  study_exclusions:
  - id: X1
    rule: report exposes no recognised section header
    reason: cannot be separated into pre-diagnostic and diagnostic parts
  - id: X2
    rule: report merges findings and impression into a single section
    reason: frozen primary/sensitivity label-source separation is not recoverable
  section_exclusions_study_retained:
  - id: X3
    rule: drop WET READ and PROVISIONAL FINDINGS IMPRESSION sections
    reason: preliminary interpretation is post-diagnostic; study remains eligible
  ordering_note: pre-diagnostic sections occurring after a label section are retained
    because extraction is header-driven
models:
  core:
  - id: M1
    name: image_only
    modalities:
    - image
    purpose: non_multimodal_control
  - id: M2
    name: text_only
    modalities:
    - pre_diagnostic_text
    purpose: text_signal_and_shortcut_control
  - id: M3
    name: probability_late_fusion
    modalities:
    - image
    - pre_diagnostic_text
    purpose: transparent_multimodal_baseline
  - id: M4
    name: feature_concatenation_fusion
    modalities:
    - image
    - pre_diagnostic_text
    purpose: learned_multimodal_baseline
  conditional:
  - id: M5
    name: missing_context_aware_mitigation
    authorization: requires_prespecified_amendment_after_baseline_failure
  exact_backbones:
    status: RESOLVED
    resolved_in_protocol_version: 0.4.0
    image:
      architecture: densenet121
      pretraining: imagenet
      input_resolution: 224
      input_channels: 3
      grayscale_handling: replicate_to_three_channels
      classifier_head: five_independent_sigmoid_outputs
    text:
      architecture: bert_base_uncased
      pretraining: bert-base-uncased
      max_sequence_length: 128
      pooling: cls_token
      frozen_encoder: false
    fusion:
      m3: probability_average_of_m1_and_m2
      m4: concatenate_pooled_features_then_two_layer_mlp
    optimization:
      batch_size: 32
      # v0.4.1: measured, not assumed. On this Turing TU116 card mixed precision
      # runs at 31 img/s against 117 img/s for fp32, because the part has fp16
      # capability but no tensor cores, so autocast overhead is not repaid.
      mixed_precision: false
      cudnn_benchmark: true
      max_epochs: 15
      early_stopping_metric: validation_auroc_macro
      early_stopping_dataset: mimic_train_internal_validation
      early_stopping_patience: 3
    hardware_gate:
      device: single_consumer_gpu
      vram_gb: 6
      constraint_note: >-
        The 6 GB budget excludes large-resolution or high-parameter backbones at
        a usable batch size. DenseNet-121 at 224 fits with headroom, measured at
        4.60 GB peak in fp32, and is the established CheXNet and CheXpert
        baseline, so architecture is not a competing explanation for any
        transport effect.
    selection_basis: >-
      Fixed on hardware feasibility and published precedent alone. No label,
      model output, metric, or external result was inspected. The study does not
      claim architectural novelty, so the backbone is a control to be held
      constant, not a variable to be optimised.
  architecture_selection_must_precede_external_results: true
classification_policy:
  threshold_scope: per_pathology
  threshold_selection_dataset: mimic_train_calibration
  criterion: balanced_accuracy
  frozen_for_internal_and_external_evaluation: true
selective_policy:
  confidence_per_pathology: abs(2*p-1)
  primary_study_confidence: minimum_pathology_confidence
  secondary_study_confidence: mean_pathology_confidence
  primary_loss: five_label_hamming_error
  abstention_meaning: refer_for_human_interpretation
  threshold_selection_dataset: mimic_train_calibration
  primary_source_coverage: 0.8
  sensitivity_source_coverages:
  - 0.9
  - 0.7
  frozen_threshold_transfer: true
uncertainty_baselines:
  required:
  - raw_probability_margin
  - temperature_scaled_probability_margin
  - split_conformal_singleton_acceptance
  conditional:
  - three_seed_ensemble
statistics:
  bootstrap_replicates: 2000
  bootstrap_seed: 20260718
  interval: 95_percent_percentile
  resampling_unit: patient
  controlled_context_comparisons: paired_patient_bootstrap
  cross_institution_comparisons: independent_within_site_patient_bootstrap
  pathology_multiplicity: holm
failure_criteria:
  selective_transport_failure:
    ci_excludes_zero: true
    minimum_absolute_risk_increase: 0.02
  material_coverage_drift: 0.05
  compound_shift_failure:
    ci_excludes_zero: true
    minimum_absolute_interaction: 0.02
  # v0.3.0 clarification. The rule requires the point estimate itself to reach
  # the materiality threshold. Evaluated at a true effect exactly equal to that
  # threshold, the estimate exceeds it in only half of repetitions, so power is
  # capped at 50% regardless of sample size (verified at implied n ~1e9 in
  # Stage 3D). Materiality is therefore the smallest effect worth acting on,
  # NOT the design effect. The study is powered against the minimum detectable
  # effect reported in Stage 3D, and any hypothesis whose MDE exceeds the
  # achievable range is reported as estimation with an interval rather than as
  # a powered decision.
  power_specification:
    materiality_is_design_effect: false
    powered_against: stage3d_minimum_detectable_effect
    target_power: 0.80
    underpowered_hypotheses_reported_as: estimation_with_interval
    evidence: results/c3e_power/
governance:
  external_dataset_prohibited_uses:
  - architecture_selection
  - fusion_weight_selection
  - early_stopping
  - temperature_selection
  - classification_threshold_selection
  - confidence_score_selection
  - abstention_threshold_selection
  - text_cleaning_rule_revision
  - context_state_rule_revision
  - model_retraining
  post_target_inspection_changes_label: post_hoc_exploratory
  training_authorized: false

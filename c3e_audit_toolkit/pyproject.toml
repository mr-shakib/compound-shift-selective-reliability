[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "c3e-audit"
version = "0.1.0"
description = "Local-only dataset census and lexical leakage audit for MIMIC-CXR and CheXpert Plus."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
]

[project.scripts]
c3e-audit = "c3e.cli:main"

[tool.setuptools.packages.find]
include = ["c3e*"]
